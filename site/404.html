<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · John Baltazar</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23145c4f'/%3E%3Ctext x='16' y='21.5' font-family='ui-monospace,Menlo,monospace' font-size='14' font-weight='700' fill='%23fff' text-anchor='middle'%3Ejb%3C/text%3E%3C/svg%3E">
  <!--
    The site's "not found" page. The bucket is private behind OAC and CloudFront
    has no s3:ListBucket, so a missing key comes back from S3 as 403, not 404:
    map both 403 and 404 to this page. Keep every URL absolute: it is rendered
    at whatever path the visitor requested.
  -->
  <style>
    :root {
      --bg: #f7f6f2; --surface: #ffffff; --ink: #17191c; --ink-2: #4a4f57; --ink-3: #737a84;
      --line: #e3e1da; --accent: #145c4f;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111315; --surface: #181b1e; --ink: #eceae4; --ink-2: #b4b8be; --ink-3: #868c94; --line: #2a2e33; --accent: #6fcbb5; }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      display: grid; place-items: center; padding: 24px 20px;
      background: var(--bg); color: var(--ink); font: 16px/1.6 var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    main { width: 100%; max-width: 560px; }
    .code { font: 700 clamp(64px, 18vw, 112px)/1 var(--mono); letter-spacing: -0.05em; color: var(--accent); margin: 0 0 12px; }
    h1 { font-size: clamp(24px, 5vw, 32px); line-height: 1.2; letter-spacing: -0.02em; margin: 0 0 12px; }
    p { color: var(--ink-2); margin: 0 0 28px; }
    a.btn {
      display: inline-block; padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 14px;
      background: var(--accent); color: var(--bg); text-decoration: none;
    }
    a.btn:hover { opacity: 0.9; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>This page doesn't exist.</h1>
    <p>The link may be old, or the address may have a typo. Everything that's here lives on the home page.</p>
    <a class="btn" href="/">Back to jbaltz.com</a>
  </main>
</body>
</html>
